name: Update sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "robots.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap and crawler instructions
        run: python3 scripts/generate_sitemap.py

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sitemap and robots.txt are already up to date."
          else
            git commit -m "chore: refresh sitemap"
            git push
          fi
